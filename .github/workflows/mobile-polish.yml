name: Wire mobile polish stylesheet

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Add mobile polish stylesheet
        shell: bash
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='<link rel=\"stylesheet\" href=\"styles.css\" />'; new=old+'\\n  <link rel=\"stylesheet\" href=\"mobile-polish.css?v=20260917\" />'; p.write_text(s if 'mobile-polish.css' in s else s.replace(old,new,1), encoding='utf-8')"

      - name: Commit change
        shell: bash
        run: |
          git config user.name "beast-site-bot"
          git config user.email "beast-site-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change needed."
          else
            git add index.html
            git commit -m "Load BEAST mobile polish stylesheet"
            git push
          fi
