name: Refresh frame-safe mobile CSS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/frame-safe-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Bump mobile stylesheet version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'mobile-polish.css?v=20260917-v2'
          new = 'mobile-polish.css?v=20260917-v3'
          if new not in s:
              if old not in s:
                  raise SystemExit('mobile stylesheet reference not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name "beast-site-bot"
          git config user.email "beast-site-bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Load frame-safe BEAST mobile CSS"
            git push
          fi
